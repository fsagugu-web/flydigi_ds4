; =====================================================================
;  flydigi_ds4 - configuração
;  Coloque este arquivo em /data/GoldHEN/flydigi_ds4.ini
;  As mudanças valem a partir da próxima vez que você abrir um jogo.
;  Linhas que começam com ; são comentários e são ignoradas.
; =====================================================================

[default]
; ---------------------------------------------------------------------
; BOTÕES: botão do Flydigi = botão do PS4
;
; Botões do Flydigi (nomes do Xbox):
;   A  B  X  Y  LB  RB  LT  RT  START  BACK  GUIDE  L3  R3
;   UP  DOWN  LEFT  RIGHT  (direcional)
;
; Botões do PS4 que você pode usar:
;   CROSS (ou XIS)   CIRCLE (ou BOLA)   SQUARE (ou QUADRADO)
;   TRIANGLE (ou TRIANGULO)   L1  R1  L2  R2  L3  R3
;   OPTIONS   TOUCHPAD   UP  DOWN  LEFT  RIGHT
;   NONE (ou NENHUM) = o botão não faz nada
;
; Também dá para apertar dois de uma vez:  LB = L1+R1
; O botão PS e o Share não podem ser usados: são do sistema, não do jogo.
; ---------------------------------------------------------------------
A = CROSS
B = CIRCLE
X = SQUARE
Y = TRIANGLE
LB = L1
RB = R1
LT = L2
RT = R2
START = OPTIONS
BACK = TOUCHPAD
GUIDE = NONE
L3 = L3
R3 = R3
UP = UP
DOWN = DOWN
LEFT = LEFT
RIGHT = RIGHT

; ---------------------------------------------------------------------
; ANALÓGICOS: zona morta em % (0 a 50).
; Movimentos menores que isso são ignorados. Aumente se o personagem
; ou a câmera andar sozinho; diminua se achar o analógico "duro".
; ---------------------------------------------------------------------
deadzone_left = 9
deadzone_right = 9

; ---------------------------------------------------------------------
; GATILHOS: a partir de quantos % o LT/RT conta como apertado (1 a 100).
; ---------------------------------------------------------------------
trigger_threshold = 8

; ---------------------------------------------------------------------
; VIBRAÇÃO em % (0 = desligada, 100 = normal).
; ---------------------------------------------------------------------
vibration = 100

; ---------------------------------------------------------------------
; TOUCHPAD (o botão ligado a TOUCHPAD acima, normalmente o BACK/View):
;   click = o botão só clica no touchpad (padrão)
;   swipe = segurando o botão, o analógico direito vira o dedo no
;           touchpad (para deslizar). Toque rápido = clique.
;           Segurar parado meio segundo = clique segurado.
;           R3 enquanto segura = clique no ponto onde o dedo está.
; ---------------------------------------------------------------------
touchpad_mode = click

; ---------------------------------------------------------------------
; AVISOS "Flydigi conectado/desconectado" na tela (sim ou nao).
; ---------------------------------------------------------------------
notifications = sim

; ---------------------------------------------------------------------
; LOG de diagnóstico em /data/GoldHEN/flydigi_ds4.txt (sim ou nao).
; Deixe "nao" no dia a dia; ligue se algo der errado ou se o seu
; controle USB não for reconhecido (o log descreve controles desconhecidos).
; ---------------------------------------------------------------------
log = nao

; ---------------------------------------------------------------------
; GIROSCÓPIO (experimental) - só Flydigi Direwolf 2.
; Repassa o movimento do controle para o giroscópio do DS4, para jogos
; com mira ou câmera por movimento. O Direwolf 2 só informa movimento
; horizontal e vertical (não tem inclinação/acelerômetro), então jogos
; que usam o controle como volante ou nível não vão funcionar.
;   gyro = sim ou nao
;   gyro_sensitivity = 1 a 500 (%)  - aumente se a mira andar pouco
;   gyro_invert_horizontal / gyro_invert_vertical = sim se a mira
;       andar ao contrário naquele eixo
; ---------------------------------------------------------------------
gyro = nao
gyro_sensitivity = 100
gyro_invert_horizontal = nao
gyro_invert_vertical = nao


; =====================================================================
;  AJUSTES POR JOGO (opcional)
;  Crie uma seção com o código do jogo (aparece no log como "jogo: CUSA...")
;  e coloque só o que quiser mudar naquele jogo. O resto vem do [default].
;  Exemplo: tirar a vibração e trocar A com B só no jogo CUSA17776:
; =====================================================================
; [CUSA17776]
; vibration = 0
; A = CIRCLE
; B = CROSS
