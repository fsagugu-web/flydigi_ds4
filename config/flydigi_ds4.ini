; =====================================================================
;  flydigi_ds4 - settings
;  Put this file in /data/GoldHEN/flydigi_ds4.ini
;  Changes take effect the next time you start a game.
;  Lines starting with ; are comments and are ignored.
; =====================================================================

[default]
; ---------------------------------------------------------------------
; BUTTONS: Flydigi button = PS4 button
;
; Flydigi buttons (Xbox names):
;   A  B  X  Y  LB  RB  LT  RT  START  BACK  GUIDE  L3  R3
;   UP  DOWN  LEFT  RIGHT  (d-pad)
;
; PS4 buttons you can use:
;   CROSS  CIRCLE  SQUARE  TRIANGLE  L1  R1  L2  R2  L3  R3
;   OPTIONS  TOUCHPAD  UP  DOWN  LEFT  RIGHT
;   NONE = the button does nothing
;
; You can also press two at once:  LB = L1+R1
; PS and Share cannot be used: they belong to the system, not the game.
; ---------------------------------------------------------------------
A = CROSS
B = CIRCLE
X = SQUARE
Y = TRIANGLE
LB = L1
RB = R1
LT = L2
RT = R2
START = OPTIONS
BACK = TOUCHPAD
GUIDE = NONE
L3 = L3
R3 = R3
UP = UP
DOWN = DOWN
LEFT = LEFT
RIGHT = RIGHT

; ---------------------------------------------------------------------
; STICKS: deadzone in % (0 to 50).
; Smaller movements are ignored. Raise it if your character or the
; camera drifts on its own; lower it if the stick feels "stiff".
; ---------------------------------------------------------------------
deadzone_left = 9
deadzone_right = 9

; ---------------------------------------------------------------------
; TRIGGERS: how far (%) LT/RT must be pressed to count as pressed (1 to 100).
; ---------------------------------------------------------------------
trigger_threshold = 8

; ---------------------------------------------------------------------
; VIBRATION in % (0 = off, 100 = normal).
; ---------------------------------------------------------------------
vibration = 100

; ---------------------------------------------------------------------
; TOUCHPAD (the button mapped to TOUCHPAD above, normally BACK/View):
;   click = the button just clicks the touchpad (default)
;   swipe = while you hold the button, the right stick becomes your
;           finger on the touchpad (to swipe). Quick tap = click.
;           Hold still for half a second = click and hold.
;           R3 while holding = click where the finger is.
; ---------------------------------------------------------------------
touchpad_mode = click

; ---------------------------------------------------------------------
; On-screen "Flydigi connected/disconnected" NOTIFICATIONS (yes or no).
; ---------------------------------------------------------------------
notifications = yes

; ---------------------------------------------------------------------
; Diagnostic LOG in /data/GoldHEN/flydigi_ds4.txt (yes or no).
; Leave it on "no" day to day; turn it on if something goes wrong or if
; your USB controller is not recognized (the log describes unknown
; controllers).
; ---------------------------------------------------------------------
log = no

; ---------------------------------------------------------------------
; GYRO (experimental) - Flydigi Direwolf 2 only.
; Sends the controller's motion to the DS4 gyro, for games with motion
; aiming or motion camera. The Direwolf 2 only reports horizontal and
; vertical motion (no tilt, no accelerometer), so games that use the
; controller as a steering wheel or a level will not work.
;   gyro = yes or no
;   gyro_sensitivity = 1 to 500 (%)  - raise it if the aim moves too little
;   gyro_invert_horizontal / gyro_invert_vertical = yes if the aim
;       moves the wrong way on that axis
; ---------------------------------------------------------------------
gyro = no
gyro_sensitivity = 100
gyro_invert_horizontal = no
gyro_invert_vertical = no


; =====================================================================
;  PER-GAME SETTINGS (optional)
;  Create a section named after the game's ID (shown in the log as
;  "game: CUSA...") and put only what you want to change in that game.
;  Everything else comes from [default].
;  Example: no vibration and A/B swapped only in CUSA17776:
; =====================================================================
; [CUSA17776]
; vibration = 0
; A = CIRCLE
; B = CROSS
